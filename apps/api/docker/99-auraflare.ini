; Match the bounded application upload contract for real HTTP requests.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_file_uploads = 5
max_execution_time = 30
expose_php = Off
display_errors = Off
log_errors = On
; Use system trust normally; cloud development mounts its combined proxy CA bundle.
openssl.cafile = ${AURAFLARE_CA_BUNDLE}
curl.cainfo = ${AURAFLARE_CA_BUNDLE}
